; Copy to /etc/weather-dashboard/config.ini (readable by the web server user AND the
; user that runs the nightly cron), or set WEATHER_DASHBOARD_CONFIG to its path.
; The pipeline also looks in ~/.config/weather-dashboard/config.ini.
; Never commit the real file.

[database]
host = localhost
name = weather
; read-only user used by the PHP API
user = weather_ro
password = CHANGE_ME
; read/write user used by the nightly pipeline
writer_user = weather_rw
writer_password = CHANGE_ME

[noaa]
; free token from https://www.ncdc.noaa.gov/cdo-web/token
token = CHANGE_ME

[mqtt]
; optional: only used by pipeline/publish_weather_to_mqtt_db.py
broker = localhost
port = 1883
username =
password =
topic_prefix = weather/30day

[site]
; ASOS station id, any station in the IEM archive:
;   https://mesonet.agron.iastate.edu/request/download.phtml
station = KDFW
; matching GHCND station for official daily precipitation:
;   https://www.ncdc.noaa.gov/cdo-web/search
ghcnd_station = GHCND:USW00003927
; location the ET is computed for (your yard, not the airport); drives Ra and NASA POWER
latitude = 33.02
longitude = -96.70
elevation_m = 207
timezone = America/Chicago
